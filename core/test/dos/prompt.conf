[sdl]
output = texturenb
vsync = off
presentation_mode = dos-rate
window_size = 800x600
fullscreen = false
pause_when_inactive = false

[mixer]
rate = 48000
blocksize = 512
prebuffer = 30
negotiate = false

[mouse]
mouse_capture = onstart
mouse_raw_input = false

[joystick]
joysticktype = none

[cpu]
core = dynamic
cycles = auto

[voodoo]
voodoo_threads = auto

[autoexec]
@echo off
mount C "kairo-host:0"
C:
dir /w
