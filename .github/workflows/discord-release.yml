name: Discord release announcement

# Releases published by tag-builds.yml use GITHUB_TOKEN, which does not raise release events,
# so that workflow dispatches this one directly. Releases published by hand arrive as events.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce'
        required: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/discord-sync
      - name: Post to Discord
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/discord-sync/release.py "$TAG"
