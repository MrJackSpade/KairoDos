name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Kairo frontend
        run: bash tools/checkout_shared.sh
      - name: Download the release's Play bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern "KairoDos-$TAG-play.aab" --dir "$RUNNER_TEMP"
      - uses: ./shared/.github/actions/play-publish
        with:
          package: com.loxifi.kairodos
          bundle: ${{ runner.temp }}/KairoDos-${{ inputs.tag }}-play.aab
          track: production
