name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: MrJackSpade/Kairo/.github/workflows/app-play-release.yml@0db6eccfb7a4658d0e0a3e37e89b35c793a5ad84
    with:
      name: KairoDos
      package: com.loxifi.kairodos
      tag: ${{ inputs.tag }}
