name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Kairo frontend
        run: bash tools/checkout_shared.sh
      - uses: ./shared/.github/actions/setup-android
      - name: Verify downloadable DOS catalog
        shell: pwsh
        run: ./tools/BuildPublicDosCatalog.ps1 -Check
      - run: ./gradlew --no-daemon :kairodos:assembleDebug
