name: Android debug build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Kairo frontend
        run: bash tools/checkout_shared.sh
      - uses: ./shared/.github/actions/setup-android
      - name: Verify downloadable DOS catalog
        shell: pwsh
        run: ./tools/BuildPublicDosCatalog.ps1 -Check
      - name: Build pinned Staging Android dependencies
        shell: pwsh
        run: ./tools/PrepareStagingDependencies.ps1
      - name: Verify offline emulator notices
        run: |
          python3 tools/GenerateStagingNotices.py
          git diff --exit-code -- kairodos/src/main/assets/THIRD_PARTY_NOTICES.txt
      - name: Build non-PGO comparator
        run: ./gradlew --no-daemon -Ppgo=false :kairodos:assembleDebug
      - name: Build default PGO and verify profile matching
        run: |
          ./gradlew --no-daemon :kairodos:assembleDebug
          python3 tools/check_pgo_profile_matching.py --output .tmp/pgo-ci
