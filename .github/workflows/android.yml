name: Android debug build

# Verifies and builds the debug APK through the shared app build workflow
# (shared/docs/android-build.md). A manual run with signed builds an APK signed with the Kairo key
# that updates an installed release.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign with the Kairo key, to update an installed release'
        type: boolean
        default: false
      version_code:
        description: 'Version code of a signed APK, above the installed one'
        type: string
        default: ''
      version_name:
        description: 'Version name of a signed APK'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: MrJackSpade/Kairo/.github/workflows/app-build.yml@916b7d979c700134e6ce0cc92f82ede770f2a108
    with:
      module: kairodos
      signed: ${{ inputs.signed || false }}
      version_code: ${{ inputs.version_code }}
      version_name: ${{ inputs.version_name }}
      # The PGO build's profile matches the sources; the build without PGO is the comparator.
      tests: |
        ./gradlew --no-daemon -Ppgo=false :kairodos:assembleWithoutImagesDebug
        ./gradlew --no-daemon :kairodos:assembleWithoutImagesDebug
        python3 tools/check_pgo_profile_matching.py --output .tmp/pgo-ci
    secrets: inherit
