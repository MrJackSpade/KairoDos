name: Discord issue threads

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Discord forum post
        env:
          DISCORD_FORUM_WEBHOOK: ${{ secrets.DISCORD_FORUM_WEBHOOK }}
          ISSUE: ${{ toJSON(github.event.issue) }}
          REPO: ${{ github.event.repository.name }}
        shell: python3 {0}
        run: |
          import json, os, urllib.request

          webhook = os.environ["DISCORD_FORUM_WEBHOOK"]
          if not webhook:
              raise SystemExit("DISCORD_FORUM_WEBHOOK secret is not set")
          issue = json.loads(os.environ["ISSUE"])
          repo = os.environ["REPO"]

          def clip(text, limit):
              return text if len(text) <= limit else text[: limit - 1] + "…"

          labels = ", ".join(label["name"] for label in issue["labels"])
          embed = {
              "title": clip(f"{repo} #{issue['number']}: {issue['title']}", 256),
              "url": issue["html_url"],
              "description": clip(issue["body"] or "", 4096),
              "author": {
                  "name": issue["user"]["login"],
                  "url": issue["user"]["html_url"],
                  "icon_url": issue["user"]["avatar_url"],
              },
              "timestamp": issue["created_at"],
          }
          if labels:
              embed["fields"] = [{"name": "Labels", "value": labels}]

          payload = {
              "thread_name": clip(f"#{issue['number']} {issue['title']}", 100),
              "embeds": [embed],
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": f"{repo}-issue-bridge"},
          )
          with urllib.request.urlopen(request) as response:
              message = json.load(response)
          print(f"Created Discord thread {message['channel_id']}")
